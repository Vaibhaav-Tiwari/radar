[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "radar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
	"fastapi==0.115.5",
	"uvicorn==0.32.1",
	"python-dotenv==1.0.1",
	"httpx==0.28.0",
	"pydantic==2.10.3",
]

[tool.setuptools]
packages = ["backend"]

[tool.vercel]
entrypoint = "backend.main:app"